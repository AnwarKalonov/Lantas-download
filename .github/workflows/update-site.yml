name: Update download page

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Version to replace
        required: true
      to_version:
        description: Version to show
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace the version on the public pages
        env:
          FROM: ${{ inputs.from_version }}
          TO: ${{ inputs.to_version }}
        run: |
          set -euo pipefail
          for file in download.html index.html docs.html versions.html README.md; do
            [ -f "$file" ] || continue
            sed -i "s/${FROM//./\\.}/${TO}/g" "$file"
          done
          git diff --stat

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Lantas"
          git config user.email "lantas@users.noreply.github.com"
          git add download.html index.html docs.html versions.html README.md
          if git diff --cached --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          git commit -m "Point the download page at Lantas ${{ inputs.to_version }}"
          git push
