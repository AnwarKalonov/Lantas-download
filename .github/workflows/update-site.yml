name: Update site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace site files
        env:
          SITE_TARBALL: https://tmpfiles.org/dl/1795484754.ee8ab8f6881d0b16/wtAWj4rzHHnP/lantas-public.tgz
        run: |
          set -euo pipefail
          curl -fsSL -A "Mozilla/5.0" "$SITE_TARBALL" -o /tmp/site.tgz
          file /tmp/site.tgz
          mkdir -p /tmp/site
          tar -xzf /tmp/site.tgz -C /tmp/site
          rsync -a --delete --exclude .git --exclude .github /tmp/site/ .

      - name: Commit the new site
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-site.yml
          git config user.name "Lantas Site"
          git config user.email "site@lantas.app"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "State the macOS 11 requirement consistently"
          git push
