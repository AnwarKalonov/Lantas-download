name: Refresh signing copy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Describe the ad-hoc build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "docs.html": (
                  "Builds are Developer ID signed and notarized, so macOS opens them normally. If a build is still blocked, open <b>System Settings → Privacy &amp; Security</b> and click <b>Open Anyway</b>; right-click → Open no longer overrides this on macOS 15 or later.",
                  "The build is ad-hoc signed, so macOS asks you to approve Lantas once. Open <b>System Settings → Privacy &amp; Security</b>, click <b>Open Anyway</b>, then authenticate. After that it opens normally. The installer clears the flag for you if you prefer.",
              ),
              "versions.html": (
                  "Builds are Developer ID signed and notarized, so they open normally. If macOS still blocks a build, open <b>System Settings → Privacy &amp; Security</b> and click <b>Open Anyway</b>.",
                  "Builds are ad-hoc signed, so macOS asks you to approve Lantas once in <b>System Settings → Privacy &amp; Security → Open Anyway</b>. After that it opens normally.",
              ),
              "README.md": (
                  "Builds are Developer ID signed and notarized, so they open normally. If macOS still\n   blocks one, open **System Settings → Privacy & Security**, click **Open Anyway**, and\n   authenticate. On macOS 15 and later, right-click → Open no longer overrides the block.",
                  "The build is ad-hoc signed, so macOS asks you to approve Lantas once. Open\n   **System Settings → Privacy & Security**, click **Open Anyway**, and authenticate.\n   After that it opens normally. On macOS 15 and later, right-click → Open no longer\n   overrides the block.",
              ),
          }

          changed = []
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old in text:
                  p.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(path)
              elif new in text:
                  print(f"{path}: already updated")
              else:
                  raise SystemExit(f"{path}: expected signing copy not found")

          print("updated:", ", ".join(changed) or "none")
          PY
          git diff --stat
          git config user.name "Lantas"
          git config user.email "lantas@users.noreply.github.com"
          git add docs.html versions.html README.md
          git diff --cached --quiet || git commit -m "Describe the ad-hoc build on the download pages."
          git push
