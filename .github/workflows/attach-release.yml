name: Attach release assets

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Presigned URL for the macOS build zip
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download the build
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL "$ARTIFACT_URL" -o build.zip
          unzip -q build.zip -d assets
          ls -lh assets
      - name: Attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets
