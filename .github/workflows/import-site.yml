name: Import the site

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Presigned URL for the Lantas-site artifact zip
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack the site
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o site.zip
          unzip -q -o site.zip -d .
          rm site.zip
          find . -maxdepth 2 -type f -not -path './.git/*' -printf '%P  %s bytes\n' | sort

      - name: Commit the site
        run: |
          set -euo pipefail
          git config user.name "Lantas"
          git config user.email "lantas@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site is already current."
            exit 0
          fi
          git commit -m "Publish the Lantas site and download page."
          git push
